services:
  openseek:
    build: .
    ports:
      # Localhost only: Docker's published ports bypass ufw. Expose it through a reverse proxy instead.
      - "127.0.0.1:8888:8888"
    environment:
      - DEEPSEEK_EMAIL=${DEEPSEEK_EMAIL}
      - DEEPSEEK_PASSWORD=${DEEPSEEK_PASSWORD}
      - DEEPSEEK_TOKEN=${DEEPSEEK_TOKEN}
      - OPENSEEK_PORT=8888
      - OPENSEEK_API_KEY=${OPENSEEK_API_KEY:-}
      - OPENSEEK_REQUEST_TIMEOUT=${OPENSEEK_REQUEST_TIMEOUT:-120}
      - OPENSEEK_LOCAL_TITLES=${OPENSEEK_LOCAL_TITLES:-1}
      - OPENSEEK_STATE_FILE=/data/sessions.json
      # Set only when a prompt file is given; the server then reads it instead of its default prompt
      - OPENSEEK_SYSTEM_PROMPT_FILE=${OPENSEEK_SYSTEM_PROMPT_FILE:+/app/system_prompt.txt}
    volumes:
      # The host file named by OPENSEEK_SYSTEM_PROMPT_FILE, or /dev/null when it isn't set
      - ${OPENSEEK_SYSTEM_PROMPT_FILE:-/dev/null}:/app/system_prompt.txt:ro
      # opencode sessions and their DeepSeek chats, kept across restarts
      - openseek-data:/data
    # Xvfb needs /dev/shm for Chrome's shared memory
    shm_size: 256mb
    # tini as PID 1 reaps orphaned Chrome processes, which python server.py never waits on
    init: true
    restart: unless-stopped

volumes:
  openseek-data:
